# Pre-commit gate. Every hook is `language: system` so it runs the same
# toolchain as `make`; nothing is installed into pre-commit's own envs.
#   airlift (Go): gofmt + go vet + go test     web: tsc + eslint + vitest
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^testdata/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^testdata/
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      # ---- airlift (Go) ----
      - id: gofmt
        name: gofmt
        entry: sh -c 'out=$(gofmt -l .); if [ -n "$out" ]; then echo "$out"; exit 1; fi'
        language: system
        files: \.go$
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        files: (\.go$|^go\.(mod|sum)$)
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        files: (\.go$|^go\.(mod|sum)$|^testdata/)
        pass_filenames: false

      # ---- web (TypeScript) ----
      - id: tsc
        name: tsc --noEmit (web)
        entry: npm --prefix web run --silent typecheck
        language: system
        files: ^web/
        exclude: ^web/dist/
        pass_filenames: false
      - id: eslint
        name: eslint (web)
        entry: npm --prefix web run --silent lint
        language: system
        files: ^web/
        exclude: ^web/dist/
        pass_filenames: false
      - id: vitest
        name: vitest (web)
        entry: npm --prefix web run --silent test
        language: system
        files: ^web/
        exclude: ^web/dist/
        pass_filenames: false
