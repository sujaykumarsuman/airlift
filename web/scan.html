<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--airlift-base-->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <title>airlift scan</title>
  </head>
  <body class="scan">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="frame" hidden></canvas>
    <div id="finder" class="finder" hidden><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
    <div id="hud">
      <div class="top">
        <div id="warning" class="warning-banner" hidden></div>
        <div class="statusline">
          <div id="progress" class="big">…</div>
          <div id="state" class="state"></div>
        </div>
        <div id="chunks" class="chunks" hidden></div>
      </div>
      <div class="bottom">
        <div id="stats" class="stats"></div>
        <div id="message" class="message"></div>
        <form id="join-form" class="join-form" hidden>
          <input id="join-name" type="text" placeholder="your name (optional)" />
          <input id="join-password" type="password" placeholder="session password" />
          <button id="join" class="btn primary" type="submit"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="3.4"/><path d="M10.4 12.6L20 3M17 6l2 2"/></svg> Join</button>
        </form>
        <div class="controls">
          <select id="camera" hidden></select>
          <button id="torch" class="btn" hidden>Torch</button>
          <button id="start" class="btn primary" hidden>Start camera</button>
        </div>
      </div>
    </div>
    <div id="ended" class="ended-overlay" hidden></div>
    <script type="module" src="/src/scan/main.ts"></script>
  </body>
</html>
