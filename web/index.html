<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--airlift-base-->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>airlift tower</title>
  </head>
  <body class="tower">
    <header class="bar">
      <div class="bar-inner">
        <span class="brand">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M6 6a9 9 0 0 0 0 12M18 6a9 9 0 0 1 0 12"/></svg>
          airlift <span class="t2">tower</span>
        </span>
        <span class="bar-right">
          <div id="session-menu" class="menu" hidden>
            <button id="power" class="btn small iconbtn" type="button" title="Session" aria-haspopup="true" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.6 6.6a7.5 7.5 0 1 0 10.8 0"/></svg></button>
            <div class="menu-list" role="menu">
              <button id="end-btn" class="btn" type="button" role="menuitem"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.2l2.8 1.8"/></svg> End session</button>
              <button id="del-btn" class="btn danger" type="button" role="menuitem"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l.9 12a1 1 0 0 0 1 .9h7.2a1 1 0 0 0 1-.9L17.5 7"/></svg> Delete now</button>
            </div>
          </div>
          <button id="new-session" class="btn small" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> New session</button>
        </span>
      </div>
    </header>
    <main id="app" class="mode-home">
      <div id="left">
        <section id="session"></section>
        <section id="place"></section>
      </div>
      <section id="status"></section>
    </main>
    <script type="module" src="/src/tower/main.ts"></script>
  </body>
</html>
