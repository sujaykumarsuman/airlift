name: deploy

# Publish the tower image to GHCR on a release tag. The image is tagged with the
# clean semver (vX.Y.Z -> X.Y.Z); Flux image-automation picks it up and deploys
# it to the k3s cluster (see sujaykumarsuman/infra). Release binaries are still
# built by release.yml in parallel.
on:
  push:
    tags: ["v*"]

jobs:
  image:
    uses: sujaykumarsuman/.github/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/sujaykumarsuman/airlift
      dockerfile: deploy/Dockerfile
      build-args: |
        VERSION=${{ github.ref_name }}
