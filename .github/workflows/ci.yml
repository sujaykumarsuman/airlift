name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web run test
      - run: npm --prefix web run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm --prefix web ci && npm --prefix web run build
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # go test covers the end to end: bundle → beam (auto fountain) → replay
      # through loss → READY → the unpacked tree equals the source
      # (internal/server, internal/replay), plus the byte-for-byte bundle and
      # frozen-vector contracts.
      - run: go test -race ./...
