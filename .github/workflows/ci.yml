name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web run test
      - run: npm --prefix web run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm --prefix web ci && npm --prefix web run build
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: end to end, sequential with 20% loss
        run: go run ./cmd/airlift replay testdata/vectors/vectors.json --dest /tmp/seq --drop 0.2 --rate 0
      - name: end to end, fountain with 30% loss and reordering
        run: go run ./cmd/airlift replay testdata/vectors/vectors-fountain.json --dest /tmp/fountain --drop 0.3 --shuffle --rate 0
      - run: diff -r /tmp/fountain/bundle-base64 testdata/bundles/multi/tree
