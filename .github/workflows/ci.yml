name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sender:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv run --directory sender --python ${{ matrix.python }} ruff check .
      - run: uv run --directory sender --python ${{ matrix.python }} ruff format --check .
      - run: uv run --directory sender --python ${{ matrix.python }} pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web run test
      - run: npm --prefix web run build

  tower:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm --prefix web ci && npm --prefix web run build
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: end to end, sequential with 20% loss
        run: go run ./cmd/tower --dest /tmp/seq --replay sender/testdata/vectors.json --drop 0.2 --rate 0
      - name: end to end, fountain with 30% loss and reordering
        run: go run ./cmd/tower --dest /tmp/fountain --replay sender/testdata/vectors-fountain.json --drop 0.3 --shuffle --rate 0
      - run: diff -r /tmp/fountain/bundle-base64 testdata/bundles/multi/tree
