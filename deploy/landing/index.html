<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>projects · sujaykumar.dev</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: #0b0d12; color: #e6e9ef;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: grid; place-items: center; padding: 2rem;
      }
      main { width: 100%; max-width: 44rem; }
      h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
      .muted { color: #9aa4b2; }
      ul { list-style: none; margin: 1.5rem 0 0; padding: 0; display: grid; gap: 0.75rem; }
      a.card {
        display: block; text-decoration: none; color: inherit;
        border: 1px solid #232838; border-radius: 12px; padding: 1rem 1.25rem;
        background: #12151d; transition: border-color 0.15s, transform 0.15s;
      }
      a.card:hover { border-color: #3b82f6; transform: translateY(-1px); }
      a.card .name { font-weight: 650; font-size: 1.05rem; }
      a.card .desc { color: #9aa4b2; font-size: 0.95rem; margin-top: 0.15rem; }
      footer { margin-top: 2rem; color: #6b7280; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Projects</h1>
      <p class="muted">Things I'm building — <a href="https://sujaykumar.dev" style="color:#7ea6ff">sujaykumar.dev</a></p>
      <ul>
        <li>
          <a class="card" href="/airlift/">
            <div class="name">airlift ↗</div>
            <div class="desc">Optical file transfer out of an air-gapped machine — scan an animated QR loop, reassemble and verify.</div>
          </a>
        </li>
      </ul>
      <footer>Add a project by dropping it behind <code>/&lt;project&gt;</code> in the Caddyfile.</footer>
    </main>
  </body>
</html>
