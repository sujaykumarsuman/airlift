apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airlift-home
spec:
  # k3s local-path provisioner: node-local, RWO. data_dir is emptied on start
  # (sessions are memory-only), so this only persists the small overrides file
  # (runtime admin config) and config across restarts. An emptyDir is a valid
  # lighter alternative if losing runtime overrides on restart is acceptable.
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
