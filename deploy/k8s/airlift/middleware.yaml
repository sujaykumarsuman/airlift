# Traefik middlewares for the airlift route. StripPrefix keeps the tower's router
# rooted (it sees /api/…); the tower still emits <base href="/airlift/"> from
# public_url (ADR 0012), exactly as under Caddy. The redirect mirrors Caddy's
# 308 from the bare /airlift to /airlift/.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: airlift-stripprefix
spec:
  stripPrefix:
    prefixes:
      - /airlift
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: airlift-redirect-slash
spec:
  redirectRegex:
    regex: "^(https?://[^/]+/airlift)$"
    replacement: "${1}/"
    permanent: true
