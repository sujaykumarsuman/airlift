apiVersion: apps/v1
kind: Deployment
metadata:
  name: airlift
  labels:
    app: airlift
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the tower is the single writer of in-memory
  # session state and holds a RWO PVC, so the old pod must stop before the new
  # one starts. The few seconds of unavailability equals today's systemd restart
  # and is covered by the memory-only non-goal. Horizontal scale needs Phase B
  # (docs/build-plan/k3s-migration.md §6).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airlift
  template:
    metadata:
      labels:
        app: airlift
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # distroless nonroot
        runAsGroup: 65532
        fsGroup: 65532     # make the local-path volume writable by nonroot
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: airlift
          image: airlift:latest
          imagePullPolicy: IfNotPresent   # image is pre-imported (no registry)
          args: ["tower"]
          ports:
            - name: http
              containerPort: 8443
          envFrom:
            - secretRef:
                name: airlift-admin       # AIRLIFT_ADMIN_TOKEN
          env:
            - name: AIRLIFT_HOME
              value: /var/lib/airlift/.airlift
          volumeMounts:
            - name: home
              mountPath: /var/lib/airlift/.airlift
            - name: config
              mountPath: /var/lib/airlift/.airlift/config
              subPath: config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/info            # public (ADR 0012); distroless has no shell
              port: 8443
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/info
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: airlift-home
        - name: config
          configMap:
            name: airlift-config
        - name: tmp
          emptyDir: {}
