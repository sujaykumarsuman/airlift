apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: airlift
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - middleware.yaml
  - ingressroute.yaml
# secret.example.yaml is intentionally NOT listed — the airlift-admin Secret is
# created out-of-band so the token is never committed (see README.md).
