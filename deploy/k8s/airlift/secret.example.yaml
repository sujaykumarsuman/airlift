# EXAMPLE ONLY — do not commit a real token and do not apply this file as-is.
# It is intentionally excluded from kustomization.yaml. Create the real Secret
# from the token already live on the VPS so it is not rotated (see README.md):
#
#   TOKEN=$(sed -n 's/^AIRLIFT_ADMIN_TOKEN=//p' /etc/default/airlift)
#   kubectl -n airlift create secret generic airlift-admin \
#     --from-literal=AIRLIFT_ADMIN_TOKEN="$TOKEN"
apiVersion: v1
kind: Secret
metadata:
  name: airlift-admin
  namespace: airlift
type: Opaque
stringData:
  AIRLIFT_ADMIN_TOKEN: "REPLACE_ME"
