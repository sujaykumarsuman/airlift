# airlift at https://projects.sujaykumar.dev/airlift. TLS comes from the default
# TLSStore (the cert-manager cert in kube-system), so no secret is referenced
# here — see docs/build-plan/k3s-migration.md §2. Higher priority than the hub's
# catch-all so /airlift/* wins.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: airlift
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`projects.sujaykumar.dev`) && PathPrefix(`/airlift`)
      kind: Rule
      priority: 100
      middlewares:
        - name: airlift-redirect-slash
        - name: airlift-stripprefix
      services:
        - name: airlift
          port: 8443
  tls: {}
