# Traefik's default TLS store. Adopting the shared cert here means every
# IngressRoute for projects.sujaykumar.dev (in any namespace) that sets `tls: {}`
# serves this certificate without referencing a secret in its own namespace.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: projects-tls
